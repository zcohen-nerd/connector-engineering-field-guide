name: Import verified Commons photos

on:
  push:
    branches: [docs/commons-photos-2026-10-05]
    paths: [.github/workflows/import-photos.yml]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Download verified source files and resize for the site
        run: |
          node --input-type=module <<'PHOTO_IMPORT'
          import fs from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import sharp from 'sharp';
          const sources = [{"file":"jst-ph-right-angle-header.jpg","url":"https://upload.wikimedia.org/wikipedia/commons/5/5a/JSTS-02-X-02PI-RA.jpg","sha1":"51988bc15de51dbc1116687b6b69fdc0b6397ef3"},{"file":"braid-foil-usb-cable.jpg","url":"https://upload.wikimedia.org/wikipedia/commons/c/c3/Braid_and_foil_shielded_usb_cable.jpg","sha1":"0778e7c818cdfb6203c066ca4806d759d74bbbdf"},{"file":"molex-housings-contacts-tool.jpg","url":"https://upload.wikimedia.org/wikipedia/commons/5/5e/Molexddpcsfamily.jpg","sha1":"0007e4a2f1732115f32bb1c92acf3c77eba786a2"},{"file":"heat-damaged-wire-ferrule.jpg","url":"https://upload.wikimedia.org/wikipedia/commons/3/3e/Burnt_wire_ferrule.jpg","sha1":"ef0d681c9cb01f55fda9355f3c035ebe329a52da"}];
          for (const asset of sources) {
            const response = await fetch(asset.url, {headers: {'User-Agent': 'ConnectorFieldGuide/1.0 (licensed Commons photo import)'}});
            if (!response.ok) throw new Error(asset.file + ': HTTP ' + response.status);
            const bytes = Buffer.from(await response.arrayBuffer());
            if (createHash('sha1').update(bytes).digest('hex') !== asset.sha1) throw new Error(asset.file + ': source checksum mismatch');
            const meta = await sharp(bytes).metadata();
            if (meta.format !== 'jpeg') throw new Error(asset.file + ': not JPEG');
            const output = 'static/img/photos/' + asset.file;
            await sharp(bytes).rotate().resize({width:1280,height:1280,fit:'inside',withoutEnlargement:true}).jpeg({quality:85,mozjpeg:true}).toFile(output);
            const result = await sharp(output).metadata();
            console.log(JSON.stringify({file:asset.file,sourceWidth:meta.width,sourceHeight:meta.height,width:result.width,height:result.height,bytes:(await fs.stat(output)).size}));
          }
          PHOTO_IMPORT
      - name: Commit imported photographs to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/img/photos/jst-ph-right-angle-header.jpg static/img/photos/braid-foil-usb-cable.jpg static/img/photos/molex-housings-contacts-tool.jpg static/img/photos/heat-damaged-wire-ferrule.jpg
          git commit -m "assets: import four verified Commons photographs"
          git push origin HEAD:docs/commons-photos-2026-10-05
