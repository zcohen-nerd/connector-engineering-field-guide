<svg xmlns="http://www.w3.org/2000/svg" width="720" height="850" viewBox="0 0 720 850" role="img" aria-labelledby="seals-title seals-desc" font-family="Arial, Helvetica, sans-serif" fill="#102040">
  <title id="seals-title">Three separate sealing boundaries</title>
  <desc id="seals-desc">Generic sectional sketches distinguish the seal between mating halves, a rear wire-entry grommet sealing around insulation, and the gasket between a connector flange and the enclosure panel. A separate unmated sketch identifies the exposed face and a possible environmental cap. Each boundary and the mated, unmated or capped configuration must be verified; the illustration establishes no IP rating.</desc>
  <rect x="1" y="1" width="718" height="848" rx="10" fill="#fff" stroke="#d0d7de"/>
  <text x="28" y="36" font-size="24" font-weight="bold">Three separate sealing boundaries</text>
  <text x="28" y="64" font-size="16" fill="#3b4453">Generic examples • shaded teal areas identify the seal being discussed</text>
  <rect x="20" y="90" width="680" height="145" rx="8" fill="#f5f8fa" stroke="#d0d7de"/>
  <rect x="20" y="250" width="680" height="145" rx="8" fill="#f5f8fa" stroke="#d0d7de"/>
  <rect x="20" y="410" width="680" height="145" rx="8" fill="#f5f8fa" stroke="#d0d7de"/>
  <text x="36" y="117" font-size="18" font-weight="bold">1  Mating interface</text>
  <path d="M 48 162 H 205 V 200 H 48 M 295 152 H 195 V 210 H 295" fill="none" stroke="#102040" stroke-width="3"/>
  <rect x="196" y="157" width="14" height="12" fill="#0b7e96"/>
  <rect x="196" y="193" width="14" height="12" fill="#0b7e96"/>
  <path d="M 91 181 H 259" stroke="#102040" stroke-width="3"/>
  <path d="M 218 142 L 203 157" fill="none" stroke="#0b7e96" stroke-width="2"/>
  <text x="350" y="163" font-size="16" >Seal between the mating halves.</text>
  <text x="350" y="190" font-size="16" >Confirm the specified fully mated</text>
  <text x="350" y="213" font-size="16" >and secured condition.</text>
  <text x="36" y="277" font-size="18" font-weight="bold">2  Rear entry</text>
  <path d="M 158 302 H 295 M 158 368 H 295" stroke="#102040" stroke-width="3"/>
  <rect x="170" y="304" width="32" height="62" rx="4" fill="#0b7e96"/>
  <rect x="48" y="319" width="235" height="32" rx="4" fill="#fff" stroke="#102040" stroke-width="2"/>
  <path d="M 48 335 H 283" stroke="#102040" stroke-width="3"/>
  <text x="350" y="315" font-size="16" >Example: grommet around</text>
  <text x="350" y="338" font-size="16" >wire insulation. Other designs</text>
  <text x="350" y="361" font-size="16" >seal around a cable jacket.</text>
  <text x="36" y="437" font-size="18" font-weight="bold">3  Panel joint</text>
  <rect x="199" y="454" width="17" height="90" fill="#d0d7de" stroke="#102040" stroke-width="2"/>
  <rect x="190" y="470" width="9" height="19" fill="#0b7e96"/>
  <rect x="190" y="511" width="9" height="19" fill="#0b7e96"/>
  <path d="M 73 480 H 178 V 461 H 190 V 489 H 284 V 511 H 190 V 539 H 178 V 520 H 73 Z" fill="#fff" stroke="#102040" stroke-width="3"/>
  <text x="350" y="480" font-size="16" >Gasket between connector</text>
  <text x="350" y="503" font-size="16" >flange and panel. Check cutout,</text>
  <text x="350" y="526" font-size="16" >thickness, finish, and mounting.</text>
  <text x="28" y="589" font-size="20" font-weight="bold">Unmated or capped is a separate configuration</text>
  <text x="28" y="616" font-size="16" fill="#3b4453">Do not carry a mated assembly’s protection rating into an untested state.</text>
  <path d="M 60 672 H 186 V 742 H 60 M 186 680 H 213 M 186 706 H 213 M 186 734 H 213" fill="none" stroke="#102040" stroke-width="3"/>
  <path d="M 295 667 H 350 V 747 H 295" fill="none" stroke="#0b7e96" stroke-width="3"/>
  <path d="M 276 707 H 239 M 247 699 L 239 707 L 247 715" fill="none" stroke="#0b7e96" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="145" y="655" font-size="15" text-anchor="middle">Exposed face</text>
  <text x="323" y="655" font-size="15" text-anchor="middle">Possible cap</text>
  <text x="392" y="676" font-size="16" >Verify face-seal construction</text>
  <text x="392" y="699" font-size="16" >and the tested state of any</text>
  <text x="392" y="722" font-size="16" >specified environmental cap.</text>
  <text x="392" y="745" font-size="16" font-weight="bold">A dust cover may not seal.</text>
  <text x="28" y="788" font-size="16" >Check rear entries on both halves and all enclosure penetrations.</text>
  <text x="28" y="820" font-size="15" fill="#3b4453">Schematic, not to scale. Seal geometry and protection are product-specific.</text>
</svg>
