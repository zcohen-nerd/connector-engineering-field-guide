<svg xmlns="http://www.w3.org/2000/svg" width="720" height="780" viewBox="0 0 720 780" role="img" aria-labelledby="return-roles-title return-roles-desc" font-family="Arial, Helvetica, sans-serif" fill="#102040">
  <title id="return-roles-title">Power return, signal reference, shield / chassis</title>
  <desc id="return-roles-desc">Three independent functional sketches, not a combined wiring schematic. A DC source feeds a load and the load current returns on a power conductor. A driver and receiver share a signal reference defining voltage levels, which may also carry signal return current. A cable shield bonds locally to an enclosure, serving EMC rather than an assumed load return or protective earth. Any intentional joins, isolation barriers and protective-earth paths must be designed and documented.</desc>
  <rect x="1" y="1" width="718" height="778" rx="10" fill="#fff" stroke="#d0d7de"/>
  <text x="28" y="36" font-size="23" font-weight="bold">Power return, signal reference, shield / chassis</text>
  <text x="28" y="64" font-size="16" fill="#3b4453">Three functions • the sketches below are independent examples</text>
  <rect x="20" y="86" width="680" height="178" rx="8" fill="#f5f8fa" stroke="#d0d7de"/>
  <text x="36" y="115" font-size="19" font-weight="bold">1  Power return</text>
  <rect x="54" y="152" width="128" height="65" rx="6" fill="#fff" stroke="#102040" stroke-width="2"/>
  <rect x="520" y="152" width="143" height="65" rx="6" fill="#fff" stroke="#102040" stroke-width="2"/>
  <path d="M 182 164 H 520" stroke="#102040" stroke-width="2"/>
  <path d="M 182 205 H 520" stroke="#0b7e96" stroke-width="4"/>
  <text x="118" y="190" font-size="17" text-anchor="middle">DC source</text>
  <text x="591" y="190" font-size="17" text-anchor="middle">Load</text>
  <text x="350" y="154" font-size="15" text-anchor="middle">Supply</text>
  <text x="350" y="196" font-size="15" text-anchor="middle">Load-current return</text>
  <path d="M 280 164 H 330 M 322 157 L 330 164 L 322 171" fill="none" stroke="#102040" stroke-width="2"/>
  <path d="M 385 205 H 335 M 343 198 L 335 205 L 343 212" fill="none" stroke="#0b7e96" stroke-width="2"/>
  <text x="36" y="246" font-size="16" >Carries normal load current back to its power source.</text>
  <rect x="20" y="280" width="680" height="178" rx="8" fill="#f5f8fa" stroke="#d0d7de"/>
  <text x="36" y="309" font-size="19" font-weight="bold">2  Signal reference</text>
  <rect x="54" y="346" width="128" height="65" rx="6" fill="#fff" stroke="#102040" stroke-width="2"/>
  <rect x="520" y="346" width="143" height="65" rx="6" fill="#fff" stroke="#102040" stroke-width="2"/>
  <path d="M 182 358 H 520" stroke="#102040" stroke-width="2"/>
  <path d="M 182 399 H 520" stroke="#0b7e96" stroke-width="4"/>
  <text x="118" y="384" font-size="17" text-anchor="middle">Driver</text>
  <text x="591" y="384" font-size="17" text-anchor="middle">Receiver</text>
  <text x="350" y="348" font-size="15" text-anchor="middle">Signal</text>
  <text x="350" y="390" font-size="15" text-anchor="middle">Reference / common</text>
  <text x="36" y="440" font-size="16" >Defines signal voltage; may also carry signal return current.</text>
  <rect x="20" y="474" width="680" height="178" rx="8" fill="#f5f8fa" stroke="#d0d7de"/>
  <text x="36" y="503" font-size="19" font-weight="bold">3  Shield / chassis</text>
  <path d="M 54 548 H 419 M 54 598 H 419" fill="none" stroke="#0b7e96" stroke-width="5"/>
  <path d="M 54 566 H 611 M 54 580 H 611" stroke="#102040" stroke-width="2"/>
  <rect x="499" y="534" width="18" height="82" fill="#d0d7de" stroke="#102040" stroke-width="2"/>
  <path d="M 419 548 V 535 H 508 V 548" fill="none" stroke="#0b7e96" stroke-width="5"/>
  <text x="214" y="538" font-size="15" text-anchor="middle">Cable shield</text>
  <text x="574" y="538" font-size="15" text-anchor="middle">Enclosure</text>
  <text x="296" y="612" font-size="15" text-anchor="middle">Conductors</text>
  <text x="36" y="634" font-size="16" >Local EMC bond shown; the other end’s treatment is a design decision.</text>
  <text x="28" y="702" font-size="18" font-weight="bold">A shared “GND” label does not define which currents may flow.</text>
  <text x="28" y="731" font-size="16" >Document intentional joins and isolation. Do not assume shield = return = PE.</text>
  <text x="28" y="759" font-size="15" fill="#3b4453">Role map, not a wiring schematic; PE and fault paths are not shown. Not to scale.</text>
</svg>
