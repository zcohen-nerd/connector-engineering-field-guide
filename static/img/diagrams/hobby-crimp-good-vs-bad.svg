<svg viewBox="0 0 760 560" width="760" height="560" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <!-- Hobby: open-barrel crimp, good vs. the four classic wrongs (strip too
       long, strip too short, stray strand, two wires in a one-wire barrel).
       Schematic geometry only - the family's contact drawing and matched
       die define the real crimp form. -->
  <rect x="0.5" y="0.5" width="759" height="559" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#102040">Open-barrel crimp — what right and wrong look like</text>

  <!-- ===== good crimp panel ===== -->
  <rect x="24" y="46" width="712" height="152" rx="8" fill="#f4f7fb" stroke="#d0d7de"/>
  <text x="380" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#102040">the good crimp</text>

  <!-- mating end -->
  <rect x="150" y="115" width="90" height="30" rx="3" fill="#ffffff" stroke="#102040" stroke-width="2"/>
  <text x="195" y="108" text-anchor="middle" font-size="11" fill="#3d6094">mating end</text>

  <!-- bare strands: tips visible before the wings, and in the gap -->
  <line x1="256" y1="126" x2="342" y2="126" stroke="#9a3412" stroke-width="1.6"/>
  <line x1="256" y1="130" x2="342" y2="130" stroke="#9a3412" stroke-width="1.6"/>
  <line x1="256" y1="134" x2="342" y2="134" stroke="#9a3412" stroke-width="1.6"/>

  <!-- conductor-wing barrel over the strands -->
  <rect x="268" y="117" width="52" height="26" rx="9" fill="#ffffff" stroke="#102040" stroke-width="2"/>
  <line x1="294" y1="117" x2="294" y2="122" stroke="#102040" stroke-width="1.5"/>

  <!-- jacket + insulation-wing barrel -->
  <line x1="344" y1="130" x2="470" y2="130" stroke="#3d6094" stroke-width="9" stroke-linecap="round"/>
  <rect x="338" y="111" width="46" height="38" rx="10" fill="#ffffff" stroke="#102040" stroke-width="2"/>
  <line x1="361" y1="111" x2="361" y2="117" stroke="#102040" stroke-width="1.5"/>

  <!-- annotations -->
  <line x1="262" y1="122" x2="252" y2="94" stroke="#9a3412" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="248" y="88" text-anchor="middle" font-size="11" fill="#9a3412">strand tips just visible</text>

  <line x1="294" y1="144" x2="270" y2="168" stroke="#9a3412" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="252" y="182" text-anchor="middle" font-size="11.5" fill="#9a3412">conductor wings on bare strands</text>
  <text x="252" y="195" text-anchor="middle" font-size="11" fill="#9a3412">— the electrical joint</text>

  <line x1="361" y1="150" x2="392" y2="168" stroke="#3d6094" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="420" y="182" text-anchor="middle" font-size="11.5" fill="#3d6094">insulation wings on jacket</text>
  <text x="420" y="195" text-anchor="middle" font-size="11" fill="#3d6094">— the strain relief</text>

  <text x="590" y="112" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#102040">✓ one wire, both wing sets formed:</text>
  <text x="590" y="130" text-anchor="middle" font-size="12" fill="#102040">joint carries current,</text>
  <text x="590" y="146" text-anchor="middle" font-size="12" fill="#102040">wings carry the tugs</text>

  <!-- ===== the four wrongs, 2 x 2 ===== -->
  <!-- panel 1: strip too long -->
  <rect x="24" y="212" width="352" height="136" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="200" y="234" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b3402f">✗ strip too long</text>
  <rect x="110" y="259" width="56" height="22" rx="3" fill="#ffffff" stroke="#102040" stroke-width="2"/>
  <line x1="118" y1="267" x2="222" y2="267" stroke="#9a3412" stroke-width="1.5"/>
  <line x1="118" y1="271" x2="222" y2="271" stroke="#9a3412" stroke-width="1.5"/>
  <rect x="174" y="258" width="36" height="20" rx="7" fill="#ffffff" stroke="#102040" stroke-width="2"/>
  <line x1="224" y1="269" x2="276" y2="269" stroke="#3d6094" stroke-width="7" stroke-linecap="round"/>
  <rect x="218" y="254" width="32" height="30" rx="8" fill="#ffffff" stroke="#102040" stroke-width="2"/>
  <ellipse cx="138" cy="269" rx="24" ry="15" fill="none" stroke="#b3402f" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="200" y="316" text-anchor="middle" font-size="11.5" fill="#b3402f">bare strands reach the mating area —</text>
  <text x="200" y="330" text-anchor="middle" font-size="11.5" fill="#b3402f">a short waiting inside the housing</text>

  <!-- panel 2: strip too short -->
  <rect x="384" y="212" width="352" height="136" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="560" y="234" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b3402f">✗ strip too short</text>
  <rect x="470" y="259" width="56" height="22" rx="3" fill="#ffffff" stroke="#102040" stroke-width="2"/>
  <line x1="537" y1="269" x2="634" y2="269" stroke="#3d6094" stroke-width="7" stroke-linecap="round"/>
  <rect x="534" y="258" width="36" height="20" rx="7" fill="#ffffff" stroke="#102040" stroke-width="2"/>
  <rect x="578" y="254" width="32" height="30" rx="8" fill="#ffffff" stroke="#102040" stroke-width="2"/>
  <text x="560" y="316" text-anchor="middle" font-size="11.5" fill="#b3402f">conductor wings closed on jacket — no</text>
  <text x="560" y="330" text-anchor="middle" font-size="11.5" fill="#b3402f">electrical joint; reads as "works, sometimes"</text>

  <!-- panel 3: stray strand -->
  <rect x="24" y="356" width="352" height="136" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="200" y="378" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b3402f">✗ stray strand</text>
  <rect x="110" y="403" width="56" height="22" rx="3" fill="#ffffff" stroke="#102040" stroke-width="2"/>
  <line x1="168" y1="411" x2="224" y2="411" stroke="#9a3412" stroke-width="1.5"/>
  <line x1="168" y1="415" x2="224" y2="415" stroke="#9a3412" stroke-width="1.5"/>
  <rect x="174" y="402" width="36" height="20" rx="7" fill="#ffffff" stroke="#102040" stroke-width="2"/>
  <path d="M176 403 q-14 -14 -26 -18" fill="none" stroke="#b3402f" stroke-width="1.8"/>
  <line x1="226" y1="413" x2="276" y2="413" stroke="#3d6094" stroke-width="7" stroke-linecap="round"/>
  <rect x="218" y="398" width="32" height="30" rx="8" fill="#ffffff" stroke="#102040" stroke-width="2"/>
  <text x="200" y="460" text-anchor="middle" font-size="11.5" fill="#b3402f">a strand escaped the wings — short risk</text>
  <text x="200" y="474" text-anchor="middle" font-size="11.5" fill="#b3402f">outside, weakened joint inside</text>

  <!-- panel 4: two wires, one barrel -->
  <rect x="384" y="356" width="352" height="136" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="560" y="378" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b3402f">✗ two wires, one barrel</text>
  <rect x="470" y="403" width="56" height="22" rx="3" fill="#ffffff" stroke="#102040" stroke-width="2"/>
  <!-- two strand bundles into one overstuffed barrel -->
  <line x1="528" y1="408" x2="586" y2="408" stroke="#9a3412" stroke-width="1.5"/>
  <line x1="528" y1="411" x2="586" y2="411" stroke="#9a3412" stroke-width="1.5"/>
  <line x1="530" y1="418" x2="586" y2="418" stroke="#9a3412" stroke-width="1.5"/>
  <line x1="530" y1="421" x2="592" y2="424" stroke="#b3402f" stroke-width="1.8"/>
  <rect x="534" y="400" width="36" height="26" rx="7" fill="none" stroke="#102040" stroke-width="2"/>
  <!-- two jackets from the right -->
  <line x1="588" y1="407" x2="648" y2="404" stroke="#3d6094" stroke-width="7" stroke-linecap="round"/>
  <line x1="592" y1="422" x2="648" y2="428" stroke="#3d6094" stroke-width="7" stroke-linecap="round"/>
  <line x1="566" y1="428" x2="596" y2="446" stroke="#b3402f" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="626" y="452" text-anchor="middle" font-size="10.5" fill="#b3402f">one bundle stays loose</text>
  <text x="560" y="472" text-anchor="middle" font-size="11.5" fill="#b3402f">the fill is unqualified — never gas-tight;</text>
  <text x="560" y="486" text-anchor="middle" font-size="11.5" fill="#b3402f">use a splice or a terminal rated for two wires</text>

  <text x="380" y="522" text-anchor="middle" font-size="13" font-weight="bold" fill="#102040">inspect every crimp, then pull-test gently — a wrong one comes off now, not in the field</text>
  <text x="380" y="546" text-anchor="middle" font-size="12" font-style="italic" fill="#6f8bb4">Schematic geometry only — each family's contact drawing and matched die define the real crimp form; see this page's tooling rules.</text>
</svg>
