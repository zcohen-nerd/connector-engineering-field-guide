<svg viewBox="0 0 760 300" width="760" height="300" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <!-- Connector product lifecycle states: active, NRND, EOL/LTB window,
       obsolete - annotated with the decision each state forces.
       Schematic only - state names and windows vary by manufacturer. -->
  <rect x="0.5" y="0.5" width="759" height="299" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#102040">A connector product's lifecycle — and the decision each state forces</text>

  <defs>
    <marker id="lcArr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#102040"/>
    </marker>
    <marker id="lcArrThin" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#3b4453"/>
    </marker>
  </defs>

  <text x="380" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#102040">notices reach customers of record, through the authorized channel — someone must be registered to receive them</text>

  <!-- state boxes -->
  <rect x="40" y="80" width="150" height="52" rx="6" fill="#e8edf4" stroke="#102040" stroke-width="2"/>
  <text x="115" y="102" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#102040">active</text>
  <text x="115" y="120" text-anchor="middle" font-size="10.5" fill="#3b4453">buy normally</text>

  <rect x="220" y="80" width="150" height="52" rx="6" fill="#f4f7fb" stroke="#102040" stroke-width="2"/>
  <text x="295" y="100" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#102040">NRND</text>
  <text x="295" y="114" text-anchor="middle" font-size="10" fill="#3b4453">not recommended</text>
  <text x="295" y="126" text-anchor="middle" font-size="10" fill="#3b4453">for new designs</text>

  <rect x="400" y="80" width="150" height="52" rx="6" fill="#cdeef6" stroke="#0b7e96" stroke-width="2"/>
  <text x="475" y="100" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#102040">EOL announced</text>
  <text x="475" y="114" text-anchor="middle" font-size="10" fill="#3b4453">final order → final ship</text>
  <text x="475" y="126" text-anchor="middle" font-size="10" fill="#3b4453">(LTB window)</text>

  <rect x="580" y="80" width="150" height="52" rx="6" fill="#ffffff" stroke="#9a3412" stroke-width="2"/>
  <text x="655" y="102" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#9a3412">obsolete</text>
  <text x="655" y="120" text-anchor="middle" font-size="10.5" fill="#3b4453">authorized channel dries up</text>

  <!-- arrows between states -->
  <line x1="190" y1="106" x2="214" y2="106" stroke="#102040" stroke-width="2" marker-end="url(#lcArr)"/>
  <line x1="370" y1="106" x2="394" y2="106" stroke="#102040" stroke-width="2" marker-end="url(#lcArr)"/>
  <line x1="550" y1="106" x2="574" y2="106" stroke="#102040" stroke-width="2" marker-end="url(#lcArr)"/>

  <!-- forced decisions -->
  <text x="115" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#102040">record approved</text>
  <text x="115" y="175" text-anchor="middle" font-size="12" font-weight="bold" fill="#102040">alternates now — calmly</text>

  <text x="295" y="160" text-anchor="middle" font-size="12" fill="#3b4453">existing designs supported;</text>
  <text x="295" y="175" text-anchor="middle" font-size="12" fill="#3b4453">start new designs elsewhere</text>

  <text x="475" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#0b7e96">decide: bridge buy ·</text>
  <text x="475" y="175" text-anchor="middle" font-size="12" font-weight="bold" fill="#0b7e96">alternate · redesign</text>

  <text x="655" y="160" text-anchor="middle" font-size="12" fill="#9a3412">broker lots need per-lot</text>
  <text x="655" y="175" text-anchor="middle" font-size="12" fill="#9a3412">scrutiny — counterfeit risk peaks</text>

  <!-- time axis -->
  <line x1="40" y1="205" x2="716" y2="205" stroke="#3b4453" stroke-width="1.5" marker-end="url(#lcArrThin)"/>
  <text x="380" y="222" text-anchor="middle" font-size="11" fill="#3b4453">time (years — often longer than the design that chose the part expected)</text>

  <text x="380" y="254" text-anchor="middle" font-size="12" font-style="italic" fill="#6f8bb4">Schematic — state names and notice windows vary by manufacturer; the notice in hand controls.</text>
  <text x="380" y="271" text-anchor="middle" font-size="12" font-style="italic" fill="#6f8bb4">Distributor lifecycle flags are early hints, not the record.</text>
</svg>
