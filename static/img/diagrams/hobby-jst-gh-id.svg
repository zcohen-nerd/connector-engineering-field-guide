<svg viewBox="0 0 760 300" width="760" height="300" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <!-- Small-pitch lookalike lineup: SH 1.0, GH 1.25 (latch), PicoBlade-style 1.25.
       Identification cues only — not to scale, no absolute dimensions asserted. -->
  <rect x="0.5" y="0.5" width="759" height="299" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#102040">The 1-point-something lineup — the GH latch arm is the tell</text>

  <!-- SH housing -->
  <rect x="140" y="110" width="60" height="34" rx="3" fill="#e8edf4" stroke="#102040" stroke-width="2"/>
  <rect x="149" y="120" width="5" height="9" fill="#ffffff" stroke="#102040" stroke-width="1"/>
  <rect x="161" y="120" width="5" height="9" fill="#ffffff" stroke="#102040" stroke-width="1"/>
  <rect x="173" y="120" width="5" height="9" fill="#ffffff" stroke="#102040" stroke-width="1"/>
  <rect x="185" y="120" width="5" height="9" fill="#ffffff" stroke="#102040" stroke-width="1"/>
  <text x="170" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#102040">JST SH — 1.0 mm</text>
  <text x="170" y="186" text-anchor="middle" font-size="12" fill="#3b4453">friction fit, smaller</text>

  <!-- GH housing with latch arm -->
  <text x="380" y="80" text-anchor="middle" font-size="11" fill="#0b7e96">positive latch — clicks</text>
  <line x1="380" y1="84" x2="380" y2="92" stroke="#0b7e96" stroke-width="1.5"/>
  <rect x="364" y="94" width="32" height="10" rx="2" fill="#d7dde6" stroke="#0b7e96" stroke-width="2"/>
  <rect x="342" y="104" width="76" height="40" rx="3" fill="#e8edf4" stroke="#102040" stroke-width="2"/>
  <rect x="354" y="116" width="6" height="10" fill="#ffffff" stroke="#102040" stroke-width="1"/>
  <rect x="369" y="116" width="6" height="10" fill="#ffffff" stroke="#102040" stroke-width="1"/>
  <rect x="384" y="116" width="6" height="10" fill="#ffffff" stroke="#102040" stroke-width="1"/>
  <rect x="399" y="116" width="6" height="10" fill="#ffffff" stroke="#102040" stroke-width="1"/>
  <text x="380" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b7e96">JST GH — 1.25 mm</text>
  <text x="380" y="186" text-anchor="middle" font-size="12" fill="#3b4453">the latch arm on top</text>

  <!-- PicoBlade-style housing -->
  <rect x="552" y="104" width="76" height="40" rx="3" fill="#e8edf4" stroke="#102040" stroke-width="2"/>
  <rect x="564" y="116" width="6" height="10" fill="#ffffff" stroke="#102040" stroke-width="1"/>
  <rect x="579" y="116" width="6" height="10" fill="#ffffff" stroke="#102040" stroke-width="1"/>
  <rect x="594" y="116" width="6" height="10" fill="#ffffff" stroke="#102040" stroke-width="1"/>
  <rect x="609" y="116" width="6" height="10" fill="#ffffff" stroke="#102040" stroke-width="1"/>
  <text x="590" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#102040">PicoBlade-style — 1.25 mm</text>
  <text x="590" y="186" text-anchor="middle" font-size="12" fill="#3b4453">friction fit, no latch</text>

  <text x="380" y="218" text-anchor="middle" font-size="13" font-weight="bold" fill="#b3402f">same 1.25 mm pitch — different families: GH and PicoBlade do not intermate</text>
  <text x="380" y="244" text-anchor="middle" font-size="13" font-weight="bold" fill="#102040">measure the pitch, then match the family by drawing — "fits" was never the question</text>
  <text x="380" y="278" text-anchor="middle" font-size="12" font-style="italic" fill="#6f8bb4">Schematic, not to scale — identification cues only; dimensions per the JST GH datasheet.</text>
</svg>
