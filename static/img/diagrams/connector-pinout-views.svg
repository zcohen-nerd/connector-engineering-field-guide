<svg xmlns="http://www.w3.org/2000/svg" width="720" height="510" viewBox="0 0 720 510" role="img" aria-labelledby="pinout-title pinout-desc" font-family="Arial, Helvetica, sans-serif" fill="#102040">
  <title id="pinout-title">One connector, two viewing directions</title>
  <desc id="pinout-desc">A fictional keyed four-contact connector viewed from its mating face and wire-entry side, with its key held at the top. Mating-face positions are 1 and 2 above 3 and 4. The rear view is 2 and 1 above 4 and 3: positions mirror, while numbers remain attached to the same physical contacts. This is not a family-standard pinout.</desc>
  <rect x="1" y="1" width="718" height="508" rx="10" fill="#fff" stroke="#d0d7de"/>
  <text x="28" y="36" font-size="24" font-weight="bold">One connector, two viewing directions</text>
  <text x="28" y="64" font-size="16" fill="#3b4453">Fictional four-contact layout • key held at the top in both views</text>
  <text x="195" y="110" font-size="21" text-anchor="middle" font-weight="bold">Mating face</text>
  <path d="M 95 185 Q 95 170 110 170 H 177 V 153 H 213 V 170 H 280 Q 295 170 295 185 V 325 Q 295 340 280 340 H 110 Q 95 340 95 325 Z" fill="#f5f8fa" stroke="#102040" stroke-width="3"/>
  <text x="195" y="142" font-size="15" text-anchor="middle">Key / reference</text>
  <circle cx="155" cy="218" r="22" fill="#0b7e96" stroke="#0b7e96" stroke-width="2"/>
  <text x="155" y="225" font-size="22" text-anchor="middle" font-weight="bold" fill="#fff">1</text>
  <circle cx="235" cy="218" r="22" fill="#fff" stroke="#0b7e96" stroke-width="2"/>
  <text x="235" y="225" font-size="22" text-anchor="middle" font-weight="bold" fill="#102040">2</text>
  <circle cx="155" cy="292" r="22" fill="#fff" stroke="#0b7e96" stroke-width="2"/>
  <text x="155" y="299" font-size="22" text-anchor="middle" font-weight="bold" fill="#102040">3</text>
  <circle cx="235" cy="292" r="22" fill="#fff" stroke="#0b7e96" stroke-width="2"/>
  <text x="235" y="299" font-size="22" text-anchor="middle" font-weight="bold" fill="#102040">4</text>
  <text x="195" y="372" font-size="16" text-anchor="middle">Looking into the mating end</text>
  <text x="525" y="110" font-size="21" text-anchor="middle" font-weight="bold">Wire-entry side</text>
  <path d="M 425 185 Q 425 170 440 170 H 507 V 153 H 543 V 170 H 610 Q 625 170 625 185 V 325 Q 625 340 610 340 H 440 Q 425 340 425 325 Z" fill="#f5f8fa" stroke="#102040" stroke-width="3"/>
  <text x="525" y="142" font-size="15" text-anchor="middle">Key / reference</text>
  <circle cx="485" cy="218" r="22" fill="#fff" stroke="#0b7e96" stroke-width="2"/>
  <text x="485" y="225" font-size="22" text-anchor="middle" font-weight="bold" fill="#102040">2</text>
  <circle cx="565" cy="218" r="22" fill="#0b7e96" stroke="#0b7e96" stroke-width="2"/>
  <text x="565" y="225" font-size="22" text-anchor="middle" font-weight="bold" fill="#fff">1</text>
  <circle cx="485" cy="292" r="22" fill="#fff" stroke="#0b7e96" stroke-width="2"/>
  <text x="485" y="299" font-size="22" text-anchor="middle" font-weight="bold" fill="#102040">4</text>
  <circle cx="565" cy="292" r="22" fill="#fff" stroke="#0b7e96" stroke-width="2"/>
  <text x="565" y="299" font-size="22" text-anchor="middle" font-weight="bold" fill="#102040">3</text>
  <text x="525" y="372" font-size="16" text-anchor="middle">Looking at the wire-entry end</text>
  <path d="M 335 255 H 385 M 343 247 L 335 255 L 343 263 M 377 247 L 385 255 L 377 263" fill="none" stroke="#0b7e96" stroke-width="2"/>
  <text x="360" y="416" font-size="18" text-anchor="middle" font-weight="bold">Positions mirror. Contact numbers stay with the contacts.</text>
  <text x="28" y="455" font-size="16" >Label connector identity, view direction, key, and pin 1 on every drawing.</text>
  <text x="28" y="483" font-size="15" fill="#3b4453">Schematic, not to scale. Check each mating half’s manufacturer drawing.</text>
</svg>
