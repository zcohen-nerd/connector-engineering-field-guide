<svg viewBox="0 0 760 450" width="760" height="450" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <!-- Qualification flow shape: configuration + FAI, baseline electricals,
       parallel sample groups through exposures, re-measure after every
       exposure, everything into the evidence record. Shape only - the
       governing spec's qualification tables set real sequences and criteria. -->
  <rect x="0.5" y="0.5" width="759" height="449" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#102040">The shape of a qualification flow — parallel groups, re-measure after every exposure</text>

  <defs>
    <marker id="qualArr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#102040"/>
    </marker>
  </defs>

  <!-- config + FAI -->
  <rect x="242" y="42" width="276" height="38" rx="6" fill="#e8edf4" stroke="#102040" stroke-width="2"/>
  <text x="380" y="60" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#102040">configuration record + first article</text>
  <text x="380" y="74" text-anchor="middle" font-size="10.5" fill="#3b4453">the samples ARE the documented configuration</text>

  <line x1="380" y1="80" x2="380" y2="90" stroke="#102040" stroke-width="2" marker-end="url(#qualArr)"/>

  <!-- baseline electricals -->
  <rect x="270" y="94" width="220" height="46" rx="6" fill="#e8edf4" stroke="#102040" stroke-width="2"/>
  <text x="380" y="113" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#102040">baseline electricals</text>
  <text x="380" y="129" text-anchor="middle" font-size="11" fill="#3b4453">continuity · LLCR · IR · DWV</text>

  <!-- fan-out arrows -->
  <line x1="330" y1="140" x2="152" y2="184" stroke="#102040" stroke-width="2" marker-end="url(#qualArr)"/>
  <line x1="380" y1="140" x2="380" y2="184" stroke="#102040" stroke-width="2" marker-end="url(#qualArr)"/>
  <line x1="430" y1="140" x2="608" y2="184" stroke="#102040" stroke-width="2" marker-end="url(#qualArr)"/>

  <!-- exposure boxes (example sample groups) -->
  <rect x="45" y="188" width="210" height="56" rx="6" fill="#e8edf4" stroke="#102040" stroke-width="2"/>
  <text x="150" y="208" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#102040">group A — durability</text>
  <text x="150" y="224" text-anchor="middle" font-size="11" fill="#3b4453">mating cycles</text>
  <text x="150" y="237" text-anchor="middle" font-size="11" fill="#3b4453">(EIA-364-09 class)</text>

  <rect x="275" y="188" width="210" height="56" rx="6" fill="#e8edf4" stroke="#102040" stroke-width="2"/>
  <text x="380" y="208" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#102040">group B — vibration</text>
  <text x="380" y="224" text-anchor="middle" font-size="11" fill="#3b4453">monitored live for discontinuities</text>
  <text x="380" y="237" text-anchor="middle" font-size="11" fill="#3b4453">(EIA-364-28 / -46 class)</text>

  <rect x="505" y="188" width="210" height="56" rx="6" fill="#e8edf4" stroke="#102040" stroke-width="2"/>
  <text x="610" y="208" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#102040">group C — sealing / immersion</text>
  <text x="610" y="224" text-anchor="middle" font-size="11" fill="#3b4453">mated (and capped, if claimed)</text>
  <text x="610" y="237" text-anchor="middle" font-size="11" fill="#3b4453">(IEC 60529 class + program)</text>

  <!-- arrows to re-measure -->
  <line x1="150" y1="244" x2="150" y2="272" stroke="#102040" stroke-width="2" marker-end="url(#qualArr)"/>
  <line x1="380" y1="244" x2="380" y2="272" stroke="#102040" stroke-width="2" marker-end="url(#qualArr)"/>
  <line x1="610" y1="244" x2="610" y2="272" stroke="#102040" stroke-width="2" marker-end="url(#qualArr)"/>

  <!-- re-measure boxes -->
  <rect x="45" y="276" width="210" height="38" rx="6" fill="#cdeef6" stroke="#0b7e96" stroke-width="2"/>
  <text x="150" y="299" text-anchor="middle" font-size="12" font-weight="bold" fill="#0b7e96">re-measure the baseline set</text>

  <rect x="275" y="276" width="210" height="38" rx="6" fill="#cdeef6" stroke="#0b7e96" stroke-width="2"/>
  <text x="380" y="299" text-anchor="middle" font-size="12" font-weight="bold" fill="#0b7e96">re-measure the baseline set</text>

  <rect x="505" y="276" width="210" height="38" rx="6" fill="#cdeef6" stroke="#0b7e96" stroke-width="2"/>
  <text x="610" y="299" text-anchor="middle" font-size="12" font-weight="bold" fill="#0b7e96">re-measure — IR first</text>

  <!-- converge arrows -->
  <line x1="150" y1="314" x2="322" y2="352" stroke="#102040" stroke-width="2" marker-end="url(#qualArr)"/>
  <line x1="380" y1="314" x2="380" y2="352" stroke="#102040" stroke-width="2" marker-end="url(#qualArr)"/>
  <line x1="610" y1="314" x2="438" y2="352" stroke="#102040" stroke-width="2" marker-end="url(#qualArr)"/>

  <!-- evidence box -->
  <rect x="230" y="356" width="300" height="42" rx="6" fill="#e8edf4" stroke="#102040" stroke-width="2"/>
  <text x="380" y="374" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#102040">the evidence record</text>
  <text x="380" y="390" text-anchor="middle" font-size="11" fill="#3b4453">report + data + dispositions, at revision, findable</text>

  <text x="380" y="420" text-anchor="middle" font-size="13" font-weight="bold" fill="#102040">exposure alone proves nothing — the re-measurement is the test</text>
  <text x="380" y="438" text-anchor="middle" font-size="12" font-style="italic" fill="#6f8bb4">Shape only — the governing specification's qualification tables set the actual sequences, groups, sample counts, and pass/fail criteria.</text>
</svg>
