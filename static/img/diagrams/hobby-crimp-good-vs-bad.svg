<svg viewBox="0 0 760 440" width="760" height="440" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <!-- Hobby: open-barrel crimp, good vs. the three classic wrongs.
       Schematic geometry only - the family's contact drawing and matched
       die define the real crimp form. -->
  <rect x="0.5" y="0.5" width="759" height="439" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#102040">Open-barrel crimp — what right and wrong look like</text>

  <!-- ===== good crimp panel ===== -->
  <rect x="24" y="46" width="712" height="152" rx="8" fill="#f4f7fb" stroke="#d0d7de"/>
  <text x="380" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#102040">the good crimp</text>

  <!-- mating end -->
  <rect x="150" y="115" width="90" height="30" rx="3" fill="#ffffff" stroke="#102040" stroke-width="2"/>
  <text x="195" y="108" text-anchor="middle" font-size="11" fill="#3d6094">mating end</text>

  <!-- bare strands: tips visible before the wings, and in the gap -->
  <line x1="256" y1="126" x2="342" y2="126" stroke="#9a3412" stroke-width="1.6"/>
  <line x1="256" y1="130" x2="342" y2="130" stroke="#9a3412" stroke-width="1.6"/>
  <line x1="256" y1="134" x2="342" y2="134" stroke="#9a3412" stroke-width="1.6"/>

  <!-- conductor-wing barrel over the strands -->
  <rect x="268" y="117" width="52" height="26" rx="9" fill="#ffffff" stroke="#102040" stroke-width="2"/>
  <line x1="294" y1="117" x2="294" y2="122" stroke="#102040" stroke-width="1.5"/>

  <!-- jacket + insulation-wing barrel -->
  <line x1="344" y1="130" x2="470" y2="130" stroke="#3d6094" stroke-width="9" stroke-linecap="round"/>
  <rect x="338" y="111" width="46" height="38" rx="10" fill="#ffffff" stroke="#102040" stroke-width="2"/>
  <line x1="361" y1="111" x2="361" y2="117" stroke="#102040" stroke-width="1.5"/>

  <!-- annotations -->
  <line x1="262" y1="122" x2="252" y2="94" stroke="#9a3412" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="248" y="88" text-anchor="middle" font-size="11" fill="#9a3412">strand tips just visible</text>

  <line x1="294" y1="144" x2="270" y2="168" stroke="#9a3412" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="252" y="182" text-anchor="middle" font-size="11.5" fill="#9a3412">conductor wings on bare strands</text>
  <text x="252" y="195" text-anchor="middle" font-size="11" fill="#9a3412">— the electrical joint</text>

  <line x1="361" y1="150" x2="392" y2="168" stroke="#3d6094" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="420" y="182" text-anchor="middle" font-size="11.5" fill="#3d6094">insulation wings on jacket</text>
  <text x="420" y="195" text-anchor="middle" font-size="11" fill="#3d6094">— the strain relief</text>

  <text x="590" y="118" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#102040">✓ both wing sets formed:</text>
  <text x="590" y="134" text-anchor="middle" font-size="12" fill="#102040">joint carries current,</text>
  <text x="590" y="149" text-anchor="middle" font-size="12" fill="#102040">wings carry the tugs</text>

  <!-- ===== the three wrongs ===== -->
  <!-- panel 1: strip too long -->
  <rect x="24" y="212" width="222" height="176" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="135" y="234" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b3402f">✗ strip too long</text>
  <rect x="48" y="262" width="56" height="22" rx="3" fill="#ffffff" stroke="#102040" stroke-width="2"/>
  <line x1="56" y1="270" x2="160" y2="270" stroke="#9a3412" stroke-width="1.5"/>
  <line x1="56" y1="274" x2="160" y2="274" stroke="#9a3412" stroke-width="1.5"/>
  <rect x="112" y="261" width="36" height="20" rx="7" fill="#ffffff" stroke="#102040" stroke-width="2"/>
  <line x1="162" y1="272" x2="212" y2="272" stroke="#3d6094" stroke-width="7" stroke-linecap="round"/>
  <rect x="156" y="257" width="32" height="30" rx="8" fill="#ffffff" stroke="#102040" stroke-width="2"/>
  <ellipse cx="76" cy="272" rx="24" ry="16" fill="none" stroke="#b3402f" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="135" y="322" text-anchor="middle" font-size="11.5" fill="#b3402f">bare strands reach the</text>
  <text x="135" y="336" text-anchor="middle" font-size="11.5" fill="#b3402f">mating area — a short</text>
  <text x="135" y="350" text-anchor="middle" font-size="11.5" fill="#b3402f">waiting inside the housing</text>

  <!-- panel 2: wings on insulation -->
  <rect x="269" y="212" width="222" height="176" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="380" y="234" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b3402f">✗ strip too short</text>
  <rect x="293" y="262" width="56" height="22" rx="3" fill="#ffffff" stroke="#102040" stroke-width="2"/>
  <line x1="360" y1="272" x2="457" y2="272" stroke="#3d6094" stroke-width="7" stroke-linecap="round"/>
  <rect x="357" y="261" width="36" height="20" rx="7" fill="#ffffff" stroke="#102040" stroke-width="2"/>
  <rect x="401" y="257" width="32" height="30" rx="8" fill="#ffffff" stroke="#102040" stroke-width="2"/>
  <text x="380" y="322" text-anchor="middle" font-size="11.5" fill="#b3402f">conductor wings closed on</text>
  <text x="380" y="336" text-anchor="middle" font-size="11.5" fill="#b3402f">jacket — no electrical joint;</text>
  <text x="380" y="350" text-anchor="middle" font-size="11.5" fill="#b3402f">reads as "works, sometimes"</text>

  <!-- panel 3: stray strand -->
  <rect x="514" y="212" width="222" height="176" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="625" y="234" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b3402f">✗ stray strand</text>
  <rect x="538" y="262" width="56" height="22" rx="3" fill="#ffffff" stroke="#102040" stroke-width="2"/>
  <line x1="596" y1="270" x2="652" y2="270" stroke="#9a3412" stroke-width="1.5"/>
  <line x1="596" y1="274" x2="652" y2="274" stroke="#9a3412" stroke-width="1.5"/>
  <rect x="602" y="261" width="36" height="20" rx="7" fill="#ffffff" stroke="#102040" stroke-width="2"/>
  <path d="M604 262 q-14 -14 -26 -18" fill="none" stroke="#b3402f" stroke-width="1.8"/>
  <line x1="654" y1="272" x2="702" y2="272" stroke="#3d6094" stroke-width="7" stroke-linecap="round"/>
  <rect x="646" y="257" width="32" height="30" rx="8" fill="#ffffff" stroke="#102040" stroke-width="2"/>
  <text x="625" y="322" text-anchor="middle" font-size="11.5" fill="#b3402f">a strand escaped the wings —</text>
  <text x="625" y="336" text-anchor="middle" font-size="11.5" fill="#b3402f">short risk outside, weakened</text>
  <text x="625" y="350" text-anchor="middle" font-size="11.5" fill="#b3402f">joint inside</text>

  <text x="380" y="412" text-anchor="middle" font-size="13" font-weight="bold" fill="#102040">inspect every crimp, then pull-test gently — a wrong one comes off now, not in the field</text>
  <text x="380" y="430" text-anchor="middle" font-size="12" font-style="italic" fill="#6f8bb4">Schematic geometry only — each family's contact drawing and matched die define the real crimp form; see this page's tooling rules.</text>
</svg>
