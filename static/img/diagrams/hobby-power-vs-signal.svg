<svg viewBox="0 0 760 430" width="760" height="430" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <!-- Hobby: signal path vs. current path. A small signal connector is fine
       for milliamps; amps through it make heat at contact resistance; power
       gets a rated, keyed pair with matched gauge and a fuse near the source.
       No numeric limits asserted - they belong to exact datasheets. -->
  <rect x="0.5" y="0.5" width="759" height="429" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#102040">Same wiring instinct, different physics — signals vs. power</text>

  <!-- ===== row 1: signal, fine ===== -->
  <text x="380" y="62" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0b7e96">✓ signals: milliamps — the tiny connector is fine</text>
  <rect x="60" y="80" width="110" height="46" rx="6" fill="#e8edf4" stroke="#102040" stroke-width="2"/>
  <text x="115" y="107" text-anchor="middle" font-size="12" fill="#102040">dev board</text>
  <line x1="170" y1="103" x2="330" y2="103" stroke="#102040" stroke-width="2"/>
  <!-- small signal connector pair -->
  <rect x="330" y="92" width="26" height="22" rx="3" fill="#ffffff" stroke="#102040" stroke-width="2"/>
  <rect x="356" y="94" width="24" height="18" rx="3" fill="#ffffff" stroke="#102040" stroke-width="2"/>
  <rect x="338" y="86" width="12" height="6" rx="2" fill="#ffffff" stroke="#102040" stroke-width="1.5"/>
  <line x1="380" y1="103" x2="540" y2="103" stroke="#102040" stroke-width="2"/>
  <rect x="540" y="82" width="94" height="42" rx="6" fill="#e8edf4" stroke="#102040" stroke-width="2"/>
  <text x="587" y="107" text-anchor="middle" font-size="12" fill="#102040">sensor</text>

  <!-- ===== row 2: power through the same connector, bad ===== -->
  <text x="380" y="160" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b3402f">✗ amps through the same connector: heat at contact resistance — melted housing, not a debug session</text>
  <rect x="60" y="186" width="110" height="46" rx="6" fill="#e8edf4" stroke="#102040" stroke-width="2"/>
  <text x="115" y="207" text-anchor="middle" font-size="12" fill="#102040">battery</text>
  <text x="115" y="222" text-anchor="middle" font-size="11" fill="#3b4453">+&#160;&#160;−</text>
  <line x1="170" y1="209" x2="330" y2="209" stroke="#102040" stroke-width="2"/>
  <!-- same small connector, overheating -->
  <rect x="330" y="198" width="26" height="22" rx="3" fill="#ffffff" stroke="#b3402f" stroke-width="2"/>
  <rect x="356" y="200" width="24" height="18" rx="3" fill="#ffffff" stroke="#b3402f" stroke-width="2"/>
  <rect x="338" y="192" width="12" height="6" rx="2" fill="#ffffff" stroke="#b3402f" stroke-width="1.5"/>
  <path d="M340 190 q3 -5 0 -9 q-3 -5 0 -9" fill="none" stroke="#b3402f" stroke-width="1.8"/>
  <path d="M355 190 q3 -5 0 -9 q-3 -5 0 -9" fill="none" stroke="#b3402f" stroke-width="1.8"/>
  <path d="M370 190 q3 -5 0 -9 q-3 -5 0 -9" fill="none" stroke="#b3402f" stroke-width="1.8"/>
  <line x1="380" y1="209" x2="540" y2="209" stroke="#102040" stroke-width="2"/>
  <circle cx="570" cy="209" r="26" fill="#e8edf4" stroke="#102040" stroke-width="2"/>
  <text x="570" y="214" text-anchor="middle" font-size="13" font-weight="bold" fill="#102040">M</text>
  <text x="380" y="252" text-anchor="middle" font-size="11.5" fill="#b3402f">voltage isn't the story — current, and the heat it makes in contact resistance, is what melts housings</text>

  <!-- ===== row 3: power done right ===== -->
  <text x="380" y="292" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0b7e96">✓ power: current-rated, keyed pair — gauge matched to the load, fuse near the source</text>
  <rect x="60" y="310" width="110" height="46" rx="6" fill="#e8edf4" stroke="#102040" stroke-width="2"/>
  <text x="115" y="331" text-anchor="middle" font-size="12" fill="#102040">battery</text>
  <text x="115" y="346" text-anchor="middle" font-size="11" fill="#3b4453">+&#160;&#160;−</text>
  <line x1="170" y1="333" x2="200" y2="333" stroke="#102040" stroke-width="6" stroke-linecap="round"/>
  <!-- fuse -->
  <rect x="200" y="322" width="44" height="22" rx="4" fill="#ffffff" stroke="#102040" stroke-width="2"/>
  <line x1="206" y1="333" x2="238" y2="333" stroke="#102040" stroke-width="1.5"/>
  <text x="222" y="316" text-anchor="middle" font-size="11" fill="#3d6094">fuse</text>
  <line x1="244" y1="333" x2="330" y2="333" stroke="#102040" stroke-width="6" stroke-linecap="round"/>
  <!-- keyed power connector pair: wedge mates into notch, one way only -->
  <path d="M400 315 H466 V351 H400 L418 333 Z" fill="#ffffff" stroke="#102040" stroke-width="2"/>
  <path d="M330 315 H382 L418 333 L382 351 H330 Z" fill="#ffffff" stroke="#102040" stroke-width="2"/>
  <text x="358" y="338" text-anchor="middle" font-size="12" font-weight="bold" fill="#102040">+</text>
  <text x="442" y="338" text-anchor="middle" font-size="12" font-weight="bold" fill="#102040">−</text>
  <text x="398" y="372" text-anchor="middle" font-size="11" fill="#3d6094">keyed + polarized — reversal is mechanical, not luck</text>
  <line x1="466" y1="333" x2="540" y2="333" stroke="#102040" stroke-width="6" stroke-linecap="round"/>
  <circle cx="570" cy="333" r="26" fill="#e8edf4" stroke="#102040" stroke-width="2"/>
  <text x="570" y="338" text-anchor="middle" font-size="13" font-weight="bold" fill="#102040">M</text>

  <text x="380" y="416" text-anchor="middle" font-size="12" font-style="italic" fill="#6f8bb4">Exact current limits are deliberately absent — they belong to the exact contact, wire gauge, and datasheet, not the family name.</text>
</svg>
