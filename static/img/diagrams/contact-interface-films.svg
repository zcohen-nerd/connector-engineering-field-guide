<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <!-- Contact-interface film sketch: tin-class interface with oxide film and
       fretting debris vs. gold-class interface with metal-to-metal a-spots.
       Schematic only - film and spot scales wildly exaggerated. -->
  <rect x="0.5" y="0.5" width="759" height="379" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#102040">Why the same signal lives or dies at the contact interface</text>

  <defs>
    <marker id="filmArr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#102040"/>
    </marker>
    <marker id="filmArrBack" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto">
      <path d="M8,0 L0,4.5 L8,9 Z" fill="#102040"/>
    </marker>
  </defs>

  <!-- ============ left panel: tin ============ -->
  <rect x="24" y="46" width="352" height="258" rx="8" fill="#f4f7fb" stroke="#d0d7de"/>
  <text x="200" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#102040">Tin-class interface — film-former</text>

  <!-- micromotion arrow -->
  <line x1="162" y1="102" x2="238" y2="102" stroke="#102040" stroke-width="2" marker-start="url(#filmArrBack)" marker-end="url(#filmArr)"/>
  <text x="200" y="94" text-anchor="middle" font-size="11" fill="#3b4453">µm micro-motion (vibration, thermal cycling)</text>

  <!-- upper contact dome -->
  <path d="M 130 150 A 70 44 0 0 1 270 150 Z" fill="#d7dde6" stroke="#102040" stroke-width="2"/>
  <text x="200" y="138" text-anchor="middle" font-size="11" fill="#3b4453">tin-plated contact</text>

  <!-- lower contact bar -->
  <rect x="110" y="164" width="180" height="26" rx="3" fill="#d7dde6" stroke="#102040" stroke-width="2"/>
  <text x="200" y="181" text-anchor="middle" font-size="11" fill="#3b4453">tin-plated contact</text>

  <!-- oxide film lines on both faces -->
  <line x1="134" y1="152.5" x2="266" y2="152.5" stroke="#9a3412" stroke-width="3"/>
  <line x1="112" y1="162" x2="288" y2="162" stroke="#9a3412" stroke-width="3"/>

  <!-- fretting debris in the gap -->
  <circle cx="150" cy="157.5" r="2.4" fill="#9a3412"/>
  <circle cx="168" cy="156.5" r="2.1" fill="#9a3412"/>
  <circle cx="186" cy="158" r="2.6" fill="#9a3412"/>
  <circle cx="203" cy="156.5" r="2.2" fill="#9a3412"/>
  <circle cx="221" cy="157.8" r="2.5" fill="#9a3412"/>
  <circle cx="240" cy="156.8" r="2.2" fill="#9a3412"/>
  <circle cx="256" cy="157.6" r="2.4" fill="#9a3412"/>

  <text x="200" y="216" text-anchor="middle" font-size="12" fill="#9a3412">insulating oxide film re-grows after every wipe;</text>
  <text x="200" y="231" text-anchor="middle" font-size="12" fill="#9a3412">fretting debris collects in the contact zone</text>
  <text x="200" y="258" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#102040">mV/µA signals can't break through —</text>
  <text x="200" y="274" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#102040">resistance climbs, drifts, goes intermittent</text>
  <text x="200" y="293" text-anchor="middle" font-size="11" fill="#3b4453">(works when freshly plugged; re-mating wipes a new spot)</text>

  <!-- ============ right panel: gold ============ -->
  <rect x="384" y="46" width="352" height="258" rx="8" fill="#f4f7fb" stroke="#d0d7de"/>
  <text x="560" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#102040">Gold-class interface — noble</text>

  <!-- upper contact dome (touching) -->
  <path d="M 490 158 A 70 44 0 0 1 630 158 Z" fill="#d7dde6" stroke="#102040" stroke-width="2"/>
  <text x="560" y="136" text-anchor="middle" font-size="11" fill="#3b4453">gold-plated contact</text>

  <!-- lower contact bar, in contact -->
  <rect x="470" y="158" width="180" height="26" rx="3" fill="#d7dde6" stroke="#102040" stroke-width="2"/>
  <text x="560" y="179" text-anchor="middle" font-size="11" fill="#3b4453">gold-plated contact</text>

  <!-- metal-to-metal a-spots -->
  <circle cx="527" cy="158" r="3" fill="#102040"/>
  <circle cx="560" cy="158" r="3" fill="#102040"/>
  <circle cx="593" cy="158" r="3" fill="#102040"/>
  <line x1="601" y1="153" x2="634" y2="120" stroke="#0b7e96" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="638" y="116" font-size="11" fill="#0b7e96">metal-to-metal spots</text>

  <text x="560" y="216" text-anchor="middle" font-size="12" fill="#0b7e96">no insulating film grows in normal service —</text>
  <text x="560" y="231" text-anchor="middle" font-size="12" fill="#0b7e96">nothing needs to be "broken through"</text>
  <text x="560" y="258" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#102040">conducts at any signal level, at low force —</text>
  <text x="560" y="274" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#102040">stable low resistance for the plating's life</text>
  <text x="560" y="293" text-anchor="middle" font-size="11" fill="#3b4453">(its limits are wear and flash thickness, not chemistry)</text>

  <!-- footer rule + disclaimer -->
  <text x="380" y="328" text-anchor="middle" font-size="13" font-weight="bold" fill="#b3402f">never mate gold to tin — tin transfers to the harder gold face and brings its oxide with it</text>
  <text x="380" y="352" text-anchor="middle" font-size="12" font-style="italic" fill="#6f8bb4">Schematic — films and contact spots are nanometer-to-micrometer scale, wildly exaggerated here;</text>
  <text x="380" y="368" text-anchor="middle" font-size="12" font-style="italic" fill="#6f8bb4">plating, thickness, and force data come from the exact contact's documentation.</text>
</svg>
