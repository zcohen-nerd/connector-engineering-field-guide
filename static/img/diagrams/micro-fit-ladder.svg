<svg viewBox="0 0 760 340" width="760" height="340" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <!-- Molex Fit ladder at relative pitch scale (2.5 / 3.0 / 4.2 / 5.7 mm) plus
       the one-system-three-jobs panel. Schematic only — proportions indicative,
       no absolute dimensions asserted; figures per Molex family literature. -->
  <rect x="0.5" y="0.5" width="759" height="339" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#102040">The Molex Fit ladder — and why Micro-Fit earns its keep</text>

  <!-- Panel 1: ladder at relative scale -->
  <text x="255" y="66" text-anchor="middle" font-size="12" fill="#3b4453">the ladder, at relative pitch scale</text>
  <rect x="46" y="122" width="61" height="30" rx="4" fill="#e8edf4" stroke="#102040" stroke-width="2"/>
  <rect x="58" y="131" width="8" height="8" fill="#ffffff" stroke="#102040" stroke-width="1"/>
  <rect x="86" y="131" width="8" height="8" fill="#ffffff" stroke="#102040" stroke-width="1"/>
  <rect x="123" y="118" width="72" height="34" rx="4" fill="#e8edf4" stroke="#0b7e96" stroke-width="2.5"/>
  <rect x="137" y="128" width="9" height="9" fill="#ffffff" stroke="#102040" stroke-width="1"/>
  <rect x="170" y="128" width="9" height="9" fill="#ffffff" stroke="#102040" stroke-width="1"/>
  <rect x="211" y="110" width="101" height="42" rx="5" fill="#e8edf4" stroke="#102040" stroke-width="2"/>
  <rect x="230" y="123" width="12" height="12" fill="#ffffff" stroke="#102040" stroke-width="1"/>
  <rect x="276" y="123" width="12" height="12" fill="#ffffff" stroke="#102040" stroke-width="1"/>
  <rect x="328" y="100" width="137" height="52" rx="6" fill="#e8edf4" stroke="#102040" stroke-width="2"/>
  <rect x="352" y="116" width="16" height="16" fill="#ffffff" stroke="#102040" stroke-width="1"/>
  <rect x="414" y="116" width="16" height="16" fill="#ffffff" stroke="#102040" stroke-width="1"/>
  <text x="76" y="172" text-anchor="middle" font-size="11" font-weight="bold" fill="#3b4453">Nano-Fit</text>
  <text x="76" y="186" text-anchor="middle" font-size="11" fill="#3b4453">2.5 mm</text>
  <text x="159" y="172" text-anchor="middle" font-size="11" font-weight="bold" fill="#0b7e96">Micro-Fit 3.0</text>
  <text x="159" y="186" text-anchor="middle" font-size="11" fill="#0b7e96">3.0 mm — here</text>
  <text x="261" y="172" text-anchor="middle" font-size="11" font-weight="bold" fill="#3b4453">Mini-Fit Jr.</text>
  <text x="261" y="186" text-anchor="middle" font-size="11" fill="#3b4453">4.2 mm — ATX</text>
  <text x="396" y="172" text-anchor="middle" font-size="11" font-weight="bold" fill="#3b4453">Mega-Fit</text>
  <text x="396" y="186" text-anchor="middle" font-size="11" fill="#3b4453">5.7 mm</text>
  <text x="255" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#b3402f">the families do not intermate</text>
  <text x="255" y="228" text-anchor="middle" font-size="12" fill="#3b4453">measure the pitch, then match the family by drawing</text>

  <!-- Panel 2: one system, three jobs -->
  <text x="612" y="66" text-anchor="middle" font-size="12" fill="#3b4453">one contact system, three jobs</text>
  <rect x="530" y="88" width="34" height="12" rx="2" fill="#e8edf4" stroke="#102040" stroke-width="1.5"/>
  <rect x="530" y="102" width="34" height="9" rx="1" fill="#d7dde6" stroke="#102040" stroke-width="1.5"/>
  <text x="580" y="103" font-size="12" fill="#3b4453">wire-to-board</text>
  <rect x="524" y="124" width="22" height="14" rx="2" fill="#e8edf4" stroke="#102040" stroke-width="1.5"/>
  <rect x="550" y="124" width="22" height="14" rx="2" fill="#e8edf4" stroke="#102040" stroke-width="1.5"/>
  <text x="580" y="136" font-size="12" fill="#3b4453">wire-to-wire</text>
  <line x1="548" y1="150" x2="548" y2="176" stroke="#3b4453" stroke-width="3"/>
  <rect x="537" y="156" width="22" height="13" rx="2" fill="#e8edf4" stroke="#102040" stroke-width="1.5"/>
  <text x="580" y="167" font-size="12" fill="#3b4453">panel-mount</text>
  <text x="612" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b7e96">same terminals, same tooling</text>
  <text x="612" y="228" text-anchor="middle" font-size="12" fill="#3b4453">a whole box's internal DC in one family</text>

  <text x="380" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="#102040">the terminal P/N — not the family name — sets the current and the wire range</text>
  <text x="380" y="290" text-anchor="middle" font-size="13" font-weight="bold" fill="#b3402f">standard terminals are a ~30-cycle part — Micro-Fit is not a quick-disconnect (RMF buys ~250)</text>
  <text x="380" y="322" text-anchor="middle" font-size="12" font-style="italic" fill="#6f8bb4">Schematic, not to scale — figures per Molex family literature; each family's own datasheets govern.</text>
</svg>
