<svg viewBox="0 0 720 360" width="720" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <!-- RC battery connector ID silhouettes, face-on, schematic. Shapes are
       recognition aids only — no absolute dimensions asserted, and sizes
       are not to scale between connectors. -->
  <rect x="0.5" y="0.5" width="719" height="359" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="360" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#102040">RC battery connectors — face-on ID silhouettes</text>

  <!-- Row 1 -->
  <!-- 1. Deans / T-plug -->
  <rect x="60" y="64" width="120" height="86" rx="10" fill="#e8edf4" stroke="#102040" stroke-width="2"/>
  <rect x="86" y="86" width="68" height="12" rx="2" fill="#d7dde6" stroke="#102040" stroke-width="1.5"/>
  <rect x="114" y="106" width="12" height="34" rx="2" fill="#d7dde6" stroke="#102040" stroke-width="1.5"/>
  <text x="120" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b7e96">Deans / "T-plug"</text>
  <text x="120" y="188" text-anchor="middle" font-size="12" fill="#3b4453">two flat blades in a T</text>

  <!-- 2. EC-style -->
  <rect x="300" y="64" width="120" height="86" rx="26" fill="#e8edf4" stroke="#102040" stroke-width="2"/>
  <circle cx="336" cy="107" r="13" fill="#ffffff" stroke="#102040" stroke-width="2"/>
  <circle cx="384" cy="107" r="13" fill="#ffffff" stroke="#102040" stroke-width="2"/>
  <circle cx="336" cy="107" r="5" fill="#d7dde6" stroke="#102040" stroke-width="1.5"/>
  <circle cx="384" cy="107" r="5" fill="#d7dde6" stroke="#102040" stroke-width="1.5"/>
  <text x="360" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b7e96">EC3 / EC5 style</text>
  <text x="360" y="188" text-anchor="middle" font-size="12" fill="#3b4453">shell molded over bullets</text>

  <!-- 3. Traxxas-style -->
  <path d="M 540 78 L 640 78 Q 660 78 660 98 L 660 130 Q 660 150 640 150 L 540 150 Q 540 150 540 130 Z" fill="#e8edf4" stroke="#102040" stroke-width="2"/>
  <rect x="586" y="66" width="28" height="12" rx="4" fill="#d7dde6" stroke="#102040" stroke-width="1.5"/>
  <rect x="566" y="94" width="12" height="42" rx="2" fill="#d7dde6" stroke="#102040" stroke-width="1.5"/>
  <rect x="622" y="94" width="12" height="42" rx="2" fill="#d7dde6" stroke="#102040" stroke-width="1.5"/>
  <text x="600" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b7e96">Traxxas-style</text>
  <text x="600" y="188" text-anchor="middle" font-size="12" fill="#3b4453">parallel blades + latch tab</text>

  <!-- Row 2 -->
  <!-- 4. Tamiya-style -->
  <path d="M 66 216 L 158 216 L 174 232 L 174 296 L 66 296 Z" fill="#e8edf4" stroke="#102040" stroke-width="2"/>
  <rect x="86" y="242" width="20" height="20" fill="#ffffff" stroke="#102040" stroke-width="1.5"/>
  <rect x="134" y="242" width="20" height="20" fill="#ffffff" stroke="#102040" stroke-width="1.5"/>
  <text x="120" y="322" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b7e96">Tamiya-style</text>
  <text x="120" y="338" text-anchor="middle" font-size="12" fill="#3b4453">chamfered corner, 2 square holes</text>

  <!-- 5. Bare bullet -->
  <rect x="316" y="238" width="34" height="28" rx="6" fill="#9db0c7" stroke="#102040" stroke-width="2"/>
  <circle cx="382" cy="252" r="24" fill="#e8edf4" stroke="#102040" stroke-width="2"/>
  <circle cx="382" cy="252" r="11" fill="#d7dde6" stroke="#102040" stroke-width="1.5"/>
  <text x="360" y="322" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b7e96">Bare bullet (2–8 mm)</text>
  <text x="360" y="338" text-anchor="middle" font-size="12" fill="#3b4453">barrel under heat-shrink; ×3 on motors</text>

  <!-- 6. Anderson Powerpole -->
  <rect x="556" y="216" width="88" height="80" rx="6" fill="#e8edf4" stroke="#102040" stroke-width="2"/>
  <rect x="576" y="208" width="18" height="8" rx="2" fill="#d7dde6" stroke="#102040" stroke-width="1.5"/>
  <rect x="606" y="296" width="18" height="8" rx="2" fill="#d7dde6" stroke="#102040" stroke-width="1.5"/>
  <path d="M 572 244 L 616 244 L 628 256 L 616 268 L 572 268 Z" fill="#d7dde6" stroke="#102040" stroke-width="1.5"/>
  <text x="600" y="322" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b7e96">Anderson Powerpole</text>
  <text x="600" y="338" text-anchor="middle" font-size="12" fill="#3b4453">genderless single pole; dovetails stack</text>

</svg>
